<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drawing Slate with Letters & Numbers</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      background: #f9f9f9;
      padding: 20px;
    }

    canvas {
      border: 2px solid #444;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      background-color: #fff;
    }

    .toolbar {
      margin-top: 15px;
    }

    .color-option {
      width: 30px;
      height: 30px;
      display: inline-block;
      border: 2px solid #ccc;
      border-radius: 50%;
      margin: 0 5px;
      cursor: pointer;
    }

    .color-option:hover {
      transform: scale(1.1);
      border-color: #333;
    }

    button {
      margin: 10px 5px;
      padding: 10px 15px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    select {
      padding: 8px;
      font-size: 14px;
      margin-left: 10px;
    }

  </style>
</head>
<body>
  <h2>🎨 Drawing Slate with Letters & Numbers</h2>
  <canvas id="slate" width="800" height="500"></canvas>

  <div class="toolbar">
    <div id="colorPicker">
      <span class="color-option" style="background: black;" data-color="black"></span>
      <span class="color-option" style="background: red;" data-color="red"></span>
      <span class="color-option" style="background: blue;" data-color="blue"></span>
      <span class="color-option" style="background: green;" data-color="green"></span>
      <span class="color-option" style="background: orange;" data-color="orange"></span>
      <span class="color-option" style="background: purple;" data-color="purple"></span>
    </div>

    <button onclick="clearCanvas()">🧹 Clear</button>
    <button onclick="toggleMode()">✏️ Toggle Draw/Fill Mode</button>

    <select id="charSelect" onchange="drawCharacter(this.value)">
      <option value="">-- Select Letter/Number --</option>
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="D">D</option>
      <option value="E">E</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </div>

  <script>
    const canvas = document.getElementById('slate');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let currentColor = 'black';
    let mode = 'draw'; // draw or fill
    let currentChar = '';

    canvas.addEventListener('mousedown', (e) => {
      if (mode === 'draw') {
        drawing = true;
        ctx.beginPath();
        ctx.moveTo(e.offsetX, e.offsetY);
      } else if (mode === 'fill') {
        fillChar(e.offsetX, e.offsetY);
      }
    });

    canvas.addEventListener('mouseup', () => {
      drawing = false;
      ctx.beginPath();
    });

    canvas.addEventListener('mouseleave', () => {
      drawing = false;
      ctx.beginPath();
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!drawing || mode !== 'draw') return;
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      currentChar = '';
      ctx.beginPath();
    }

    document.querySelectorAll('.color-option').forEach(option => {
      option.addEventListener('click', () => {
        currentColor = option.getAttribute('data-color');
      });
    });

    function toggleMode() {
      mode = (mode === 'draw') ? 'fill' : 'draw';
      alert(`Switched to ${mode.toUpperCase()} mode.`);
    }

    function drawCharacter(char) {
      clearCanvas();
      currentChar = char;
      ctx.font = 'bold 200px Arial';
      ctx.strokeStyle = '#999';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeText(char, canvas.width / 2, canvas.height / 2);
    }

    function fillChar(x, y) {
      const imageData = ctx.getImageData(x, y, 1, 1);
      const pixel = imageData.data;
      const isInside = !(pixel[0] === 255 && pixel[1] === 255 && pixel[2] === 255 && pixel[3] === 0);
      
      if (isInside) {
        ctx.globalCompositeOperation = "source-in";
        ctx.fillStyle = currentColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalCompositeOperation = "source-over";
      }
    }
  </script>
</body>
</html>
